name: Accessibility

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  accessibility:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || vars.SITE_BASE_URL || 'https://headless-voyager.vercel.app' }}
      SITE_TITLE: ${{ secrets.SITE_TITLE || vars.SITE_TITLE || 'the Headless Voyager''s blog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build site
        uses: ./.github/actions/build-site

      - name: Scan for accessibility issues
        run: pnpm exec pa11y-ci --config .pa11yci
        continue-on-error: true
