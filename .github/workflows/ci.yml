name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL || vars.SITE_BASE_URL || 'https://headless-voyager.vercel.app' }}
      SITE_TITLE: ${{ secrets.SITE_TITLE || vars.SITE_TITLE || 'the Headless Voyager''s blog' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up project
        uses: ./.github/actions/setup-project

      - name: Check site
        run: just check

      - name: Audit dependencies
        run: just audit-deps
        continue-on-error: true

      - name: Build site
        run: just build

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: site-public
          path: public

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download site
        uses: actions/download-artifact@v8
        with:
          name: site-public
          path: public

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install accessibility scanner
        run: npm install --global pa11y-ci

      - name: Scan for accessibility issues
        run: pa11y-ci --config .pa11yci
        continue-on-error: true
