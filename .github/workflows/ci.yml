name: CI

on:
  push:
    branches: [ main, headlessvoyager-workspace-overview ]
  pull_request:
    branches: [ main ]

jobs:
  tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache tools
        uses: actions/cache@v4
        with:
          path: tools/bin
          key: ${{ runner.os }}-tools-${{ hashFiles('mise.toml') }}

      - name: Install `just` (pinned, verify digest) and make available
        run: |
          set -euo pipefail
          host_os=$(uname -s)
          arch=$(uname -m)
          case "$host_os-$arch" in
            "Linux-x86_64") asset="just-1.58.0-x86_64-unknown-linux-musl.tar.gz"; expected="4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d";;
            "Linux-aarch64"|"Linux-arm64") asset="just-1.58.0-aarch64-unknown-linux-musl.tar.gz"; expected="748237128c4c40cbdabc65e841d05ceba13cc23a91eaba395495894c1d9764df";;
            "Darwin-x86_64") asset="just-1.58.0-x86_64-apple-darwin.tar.gz"; expected="9a09cfef66aaa79da58203970103a0684307716caaabd3e9844cacc4dc0f4023";;
            "Darwin-arm64"|"Darwin-aarch64") asset="just-1.58.0-aarch64-apple-darwin.tar.gz"; expected="50ae3e996c974a0bf32ea7d10f495070df33f1b43e0616b2769e3d4821ed8f48";;
            *) echo "Unsupported OS/arch: $host_os-$arch" >&2; exit 1;;
          esac
          tmpdir=$(mktemp -d)
          url="https://github.com/casey/just/releases/download/1.58.0/$asset"
          echo "Downloading $url"
          curl -fsSL "$url" -o "$tmpdir/archive.tar.gz"
          printf "%s  %s\n" "$expected" "$tmpdir/archive.tar.gz" > "$tmpdir/expected.sha"
          (sha256sum -c "$tmpdir/expected.sha" || shasum -a 256 -c "$tmpdir/expected.sha")
          mkdir -p tools/bin
          tar -xzf "$tmpdir/archive.tar.gz" -C "$tmpdir"
          just_bin=$(find "$tmpdir" -type f -name just -perm -111 | head -n1 || true)
          if [ -z "$just_bin" ]; then echo "just binary not found in archive" >&2; exit 2; fi
          cp "$just_bin" tools/bin/just
          chmod +x tools/bin/just
          echo "just installed to tools/bin/just"
          rm -rf "$tmpdir"

      - name: Install pnpm (pinned, verify digest) and make available
        run: |
          set -euo pipefail
          host_os=$(uname -s)
          arch=$(uname -m)
          case "$host_os-$arch" in
            "Linux-x86_64") asset="pnpm-linux-x64.tar.gz"; expected="11caeed8b581d460638f836f10f6ead19cbf08d774a5b8e502628b20ebf3ac43";;
            "Linux-aarch64"|"Linux-arm64") asset="pnpm-linux-arm64.tar.gz"; expected="6d62b433b7a77b77e814dfaca8032bae57bb79c1a5ad50442e688c4f7fed3c8a";;
            "Linux-x86_64-musl") asset="pnpm-linux-x64-musl.tar.gz"; expected="2a25fd5614c89d3e8e7c8cabfe9f5f2aba3c4f997fb69e6934ee257dd8753ca5";;
            "Darwin-arm64"|"Darwin-aarch64") asset="pnpm-darwin-arm64.tar.gz"; expected="cdcf7130ed2e7aa324c7c76ab597de66db0529b6b1e0db9e489bde538fdc0d04";;
            "Windows-AMD64"|"MINGW64_NT-10.0-18363-x86_64") asset="pnpm-win32-x64.zip"; expected="2d0203af85fc6fbb40f786a2671f175e9119a7c6dfcc4f30b1fa17e0f072c301";;
            *) echo "Unsupported OS/arch or missing mapping: $host_os-$arch" >&2; exit 1;;
          esac
          tmpdir=$(mktemp -d)
          url="https://github.com/pnpm/pnpm/releases/download/v11.25.0/$asset"
          echo "Downloading $url"
          curl -fsSL "$url" -o "$tmpdir/archive.tar.gz"
          printf "%s  %s\n" "$expected" "$tmpdir/archive.tar.gz" > "$tmpdir/expected.sha"
          (sha256sum -c "$tmpdir/expected.sha" || shasum -a 256 -c "$tmpdir/expected.sha")
          tar -xzf "$tmpdir/archive.tar.gz" -C "$tmpdir" || (unzip -q "$tmpdir/archive.tar.gz" -d "$tmpdir")
          pnpm_bin=$(find "$tmpdir" -type f -name pnpm -perm -111 | head -n1 || true)
          if [ -z "$pnpm_bin" ]; then echo "pnpm binary not found in archive" >&2; exit 2; fi
          mkdir -p tools/bin
          cp "$pnpm_bin" tools/bin/pnpm
          chmod +x tools/bin/pnpm
          echo "pnpm installed to tools/bin/pnpm"
          rm -rf "$tmpdir"

      - name: Install zola (pinned, verify digest) and make available
        run: |
          set -euo pipefail
          host_os=$(uname -s)
          arch=$(uname -m)
          case "$host_os-$arch" in
            "Linux-x86_64") asset="zola-v0.21.0-x86_64-unknown-linux-gnu.tar.gz"; expected="5c37a8f706567d6cad3f0dbc0eaebe3b9591cc301bd67089e5ddc0d0401732d6";;
            "Linux-aarch64"|"Linux-arm64") asset="zola-v0.21.0-aarch64-unknown-linux-gnu.tar.gz"; expected="5c37a8f706567d6cad3f0dbc0eaebe3b9591cc301bd67089e5ddc0d0401732d6";;
            "Darwin-x86_64") asset="zola-v0.21.0-x86_64-apple-darwin.tar.gz"; expected="1bb896d52877ee637b16f6b8d5827ec1e5abbd4a78b541a771c65cebb10f47e8";;
            "Darwin-arm64"|"Darwin-aarch64") asset="zola-v0.21.0-aarch64-apple-darwin.tar.gz"; expected="5fa8d33c82ee9990cb41020bff0ce40caf98fe4e46d38fdf2740a81a6c78efda";;
            *) echo "Unsupported OS/arch or missing mapping: $host_os-$arch" >&2; exit 1;;
          esac
          tmpdir=$(mktemp -d)
          url="https://github.com/getzola/zola/releases/download/v0.21.0/$asset"
          echo "Downloading $url"
          curl -fsSL "$url" -o "$tmpdir/archive.tar.gz"
          printf "%s  %s\n" "$expected" "$tmpdir/archive.tar.gz" > "$tmpdir/expected.sha"
          (sha256sum -c "$tmpdir/expected.sha" || shasum -a 256 -c "$tmpdir/expected.sha")
          mkdir -p tools/bin
          tar -xzf "$tmpdir/archive.tar.gz" -C "$tmpdir"
          zola_bin=$(find "$tmpdir" -type f -name zola -perm -111 | head -n1 || true)
          if [ -z "$zola_bin" ]; then echo "zola binary not found in archive" >&2; exit 2; fi
          cp "$zola_bin" tools/bin/zola
          chmod +x tools/bin/zola
          echo "zola installed to tools/bin/zola"
          rm -rf "$tmpdir"

      - name: Add tools to PATH
        run: echo "${{ github.workspace }}/tools/bin" >> $GITHUB_PATH

      - name: Upload tools artifact
        uses: actions/upload-artifact@v4
        with:
          name: tools-bin
          path: tools/bin

  deps:
    needs: tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tools artifact
        uses: actions/download-artifact@v4
        with:
          name: tools-bin

      - name: Debug: list downloaded artifact
        run: echo "PWD: $PWD" && echo "Workspace root listing:" && ls -la && echo "Checking tools directory:" && ls -la tools || true && echo "Checking tools/bin:" && ls -la tools/bin || true

      - name: Add tools to PATH
        run: echo "${{ github.workspace }}/tools/bin" >> $GITHUB_PATH

      - name: Setup Node (for pnpm runtime)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (mise + pnpm)
        run: |
          set -euo pipefail
          mise install || true
          tools/bin/pnpm install --frozen-lockfile

  build:
    needs: [tools, deps]
    runs-on: ubuntu-latest
    env:
      SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
      SITE_TITLE: ${{ secrets.SITE_TITLE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download tools artifact
        uses: actions/download-artifact@v4
        with:
          name: tools-bin

      - name: Add tools to PATH
        run: echo "${{ github.workspace }}/tools/bin" >> $GITHUB_PATH

      - name: Verify tools & install theme
        run: |
          chmod +x tools/bin/just || true
          tools/bin/just install-theme

      - name: Run checks and audit
        run: |
          set -euo pipefail
          tools/bin/just check || true
          tools/bin/pnpm audit --audit-level=high || true

      - name: Build site
        run: |
          set -euo pipefail
          tools/bin/just build

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: public

      - name: Show artifact size
        run: du -sh public || true
