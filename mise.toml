[tools]
just = "1.58.0"  # pinned to GitHub release tag 1.58.0
"npm:pnpm" = "11.25.0"  # pinned to release v11.25.0
zola = "0.21.0"

# Environment variables that can be provided to the build runtime.
# These are suggestions for mise to export or for a .env file to be sourced
# prior to running site commands. Edit values as needed.
[env]
SITE_BASE_URL = "https://headless-voyager.vercel.app"
SITE_TITLE = "the Headless Voyager's blog"
SITE_THEME = "apollo"
SITE_THEME_PATH = "themes/apollo"
COMPILE_SASS = "true"
BUILD_SEARCH_INDEX = "true"
# Port and interface for local dev server (zola serve). These can be overridden
# by creating a .env file or by mise exporting them from this file at runtime.
PORT = "1111"
INTERFACE = "127.0.0.1"

# Top-level task definitions that mirror the Justfile recipes. They can be
# used by external tooling or scripts that read mise.toml to invoke common tasks.
[tasks]
setup = { run = "just setup", desc = "Install tools and node modules (mise install + pnpm install)" }
build-css = { run = "just build-css", desc = "Build Tailwind CSS for production (minified)" }
watch-css = { run = "just watch-css", desc = "Watch and rebuild Tailwind CSS during development" }
serve = { run = "just serve", desc = "Start the Zola local development server" }
build = { run = "just build", desc = "Build the site for production (build CSS then Zola)" }
check = { run = "just check", desc = "Run zola check to validate site" }
blog = { run = "just blog", desc = "Start development environment (Tailwind watcher + Zola server)" }

# Cryptographic digests for reproducible tool and theme installation.
# Each tool/platform maps to a sha256 digest for the release asset used to
# install the tool. Themes (git submodules) are pinned to a commit SHA.
[digests]

